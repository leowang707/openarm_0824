<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenArm Universal CAN GUI</title>
  <style>
    :root { color-scheme: dark; --bg:#11151c; --panel:#1b2230; --line:#33405a; --muted:#93a0b8; --ok:#63c174; --bad:#ef6b6b; --accent:#4c82ff; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Segoe UI,Microsoft JhengHei,sans-serif; background:var(--bg); color:#edf2fb; }
    main { max-width:1000px; margin:0 auto; padding:22px; display:grid; grid-template-columns:380px 1fr; gap:18px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; }
    h1 { font-size:20px; margin:0 0 14px; }
    h2 { font-size:15px; margin:16px 0 8px; }
    label { display:block; color:var(--muted); font-size:12px; margin:9px 0 5px; }
    input,select,button { width:100%; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:#101621; color:#edf2fb; }
    button { cursor:pointer; font-weight:600; }
    button.primary { background:var(--accent); }
    button.ok { background:var(--ok); color:#071d0b; }
    button.danger { background:var(--bad); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    .row { display:flex; gap:8px; }
    .row > * { flex:1; }
    .muted { color:var(--muted); font-size:13px; }
    .motor { border:1px solid var(--line); border-radius:8px; padding:8px; margin:6px 0; display:flex; gap:8px; align-items:center; }
    .motor input { width:auto; }
    .log { white-space:pre-wrap; min-height:180px; max-height:420px; overflow:auto; background:#0c1119; padding:12px; border-radius:8px; font:12px Consolas,monospace; }
    .lock { margin-top:10px; padding:9px; border:1px solid #866e30; background:#332b17; border-radius:8px; display:none; }
    @media(max-width:800px){ main{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>OpenArm Universal CAN GUI</h1>

    <label>Motor Model</label>
    <select id="motorModel"></select>

    <label>CAN Adapter</label>
    <select id="adapter"></select>

    <label>Device / Channel</label>
    <select id="channel"></select>

    <div class="row">
      <button class="primary" id="connect">Connect + Scan</button>
      <button id="disconnect">Disconnect</button>
    </div>

    <button id="scan" style="margin-top:8px">Scan Motor IDs</button>

    <div id="motionLock" class="lock">此型號目前鎖定運動控制；可先驗證連線、掃描與參數讀取。</div>

    <h2>Detected Motors</h2>
    <div id="motors" class="muted">尚未連線</div>

    <h2>Control Mode</h2>
    <select id="mode"></select>
    <button id="applyMode">Apply Mode</button>

    <div class="row" style="margin-top:8px">
      <button class="ok" id="enable">Enable</button>
      <button class="danger" id="disable">Disable</button>
    </div>

    <h2>Generic Command</h2>
    <div class="row">
      <div><label>Position (rad)</label><input id="position" type="number" step="0.01" value="0" /></div>
      <div><label>Velocity (rad/s)</label><input id="velocity" type="number" step="0.01" value="0" /></div>
    </div>
    <div class="row">
      <div><label>Torque (Nm)</label><input id="torque" type="number" step="0.01" value="0" /></div>
      <div><label>Kp</label><input id="kp" type="number" step="0.1" value="0" /></div>
      <div><label>Kd</label><input id="kd" type="number" step="0.1" value="0" /></div>
    </div>
    <div class="row">
      <div><label>Vel Kp</label><input id="velKp" type="number" step="0.1" value="0" /></div>
      <div><label>Vel Kd</label><input id="velKd" type="number" step="0.1" value="0" /></div>
      <div><label>Vel Ki</label><input id="velKi" type="number" step="0.001" value="0" /></div>
    </div>
    <button class="primary" id="send">Send One Command</button>
  </section>

  <section class="card">
    <h2 style="margin-top:0">State / Log</h2>
    <div id="status" class="muted">未連線</div>
    <div id="log" class="log"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let caps = null;
let state = null;

function log(msg) {
  const t = new Date().toLocaleTimeString();
  $("log").textContent += `[${t}] ${msg}\n`;
  $("log").scrollTop = $("log").scrollHeight;
}

async function api(path, opts={}) {
  const r = await fetch(path, opts);
  const data = await r.json();
  if (!r.ok || data.success === false) throw new Error(data.error || `HTTP ${r.status}`);
  return data;
}

function selectedIds() {
  return [...document.querySelectorAll('#motors input[type=checkbox]:checked')].map(x => Number(x.value));
}

function populateChannels() {
  const adapter = $("adapter").value;
  let devices = caps.devices || [];
  if (adapter === "slcan" || adapter === "usbcan_a") {
    devices = devices.filter(d => d.transport === "serial");
  } else if (adapter !== "auto") {
    devices = devices.filter(d => d.adapter === adapter);
  }
  $("channel").innerHTML = devices.length
    ? devices.map(d => `<option value="${d.channel}">${d.label}</option>`).join('')
    : `<option value="">(auto/default)</option>`;
}

function applyState(s) {
  state = s;
  const connected = !!s.connected;
  $("status").textContent = connected
    ? `${s.motor_model_name} · ${s.adapter}:${s.channel} · ${s.bitrate} bit/s`
    : '未連線';

  const modes = s.supported_modes || [];
  const current = $("mode").value;
  $("mode").innerHTML = modes.map(m => `<option value="${m}">${m}</option>`).join('');
  if (modes.includes(current)) $("mode").value = current;

  const motors = s.motors || [];
  $("motors").innerHTML = motors.length
    ? motors.map(m => {
        const checked = m.selected ? 'checked' : '';
        const extra = m.firmware != null ? ` FW=${m.firmware}` : '';
        const mode = m.control_mode_name || m.control_mode_key || '';
        return `<label class="motor"><input type="checkbox" value="${m.id}" ${checked}/><span>ID ${m.id} (0x${Number(m.id).toString(16).toUpperCase()})${extra} ${mode}</span></label>`;
      }).join('')
    : '<span class="muted">沒有掃到馬達</span>';

  $("motionLock").style.display = connected && !s.motion_allowed ? 'block' : 'none';
  $("enable").disabled = !connected || !s.motion_allowed;
  $("send").disabled = !connected || !s.motion_allowed;
  $("disable").disabled = !connected;
  $("applyMode").disabled = !connected || !modes.length;
}

async function refreshCaps() {
  const data = await api('/api/capabilities');
  caps = data;
  $("motorModel").innerHTML = (caps.motors || []).map(m => `<option value="${m.key}">${m.name}</option>`).join('');
  $("adapter").innerHTML = `<option value="auto">Auto</option>` +
    (caps.adapters || []).filter(a => a.supported).map(a => `<option value="${a.key}">${a.label}</option>`).join('');
  populateChannels();
}

$("adapter").onchange = populateChannels;

$("connect").onclick = async () => {
  try {
    const data = await api('/api/connect', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        motor_model:$("motorModel").value,
        adapter:$("adapter").value,
        channel:$("channel").value || null,
      })
    });
    applyState(data.state);
    log('Connected and scanned.');
  } catch(e) { log(`ERROR: ${e.message}`); }
};

$("disconnect").onclick = async () => {
  try { await api('/api/disconnect', {method:'POST'}); applyState({connected:false,motors:[],supported_modes:[]}); log('Disconnected.'); }
  catch(e){ log(`ERROR: ${e.message}`); }
};

$("scan").onclick = async () => {
  try { const data = await api('/api/scan', {method:'POST'}); applyState(data.state); log('Scan complete.'); }
  catch(e){ log(`ERROR: ${e.message}`); }
};

async function pushSelection() {
  if (!state?.connected) return;
  const ids = selectedIds();
  const data = await api('/api/select', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids})
  });
  applyState(data.state);
}

$("motors").onchange = () => pushSelection().catch(e => log(`ERROR: ${e.message}`));

$("applyMode").onclick = async () => {
  try {
    await pushSelection();
    const data = await api('/api/control_mode', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ids:selectedIds(), mode:$("mode").value})
    });
    applyState(data.state); log(`Mode -> ${$("mode").value}`);
  } catch(e){ log(`ERROR: ${e.message}`); }
};

$("enable").onclick = async () => {
  try {
    await pushSelection();
    const data = await api('/api/enable', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids:selectedIds()})});
    applyState(data.state); log('Enable sent.');
  } catch(e){ log(`ERROR: ${e.message}`); }
};

$("disable").onclick = async () => {
  try {
    await pushSelection();
    const data = await api('/api/disable', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids:selectedIds()})});
    applyState(data.state); log('Disable sent.');
  } catch(e){ log(`ERROR: ${e.message}`); }
};

$("send").onclick = async () => {
  try {
    await pushSelection();
    const command = {
      position:Number($("position").value), velocity:Number($("velocity").value),
      torque:Number($("torque").value), kp:Number($("kp").value), kd:Number($("kd").value),
      pos_kp:Number($("kp").value), pos_kd:Number($("kd").value),
      vel_kp:Number($("velKp").value), vel_kd:Number($("velKd").value), vel_ki:Number($("velKi").value)
    };
    const data = await api('/api/command', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ids:selectedIds(), mode:$("mode").value, command})
    });
    applyState(data.state); log('Command sent.');
  } catch(e){ log(`ERROR: ${e.message}`); }
};

setInterval(async () => {
  try { const data = await api('/api/state'); if (data.state.connected) applyState(data.state); }
  catch(_) {}
}, 500);

(async () => {
  await refreshCaps();
  applyState({connected:false,motors:[],supported_modes:[]});
})();
</script>
</body>
</html>
